<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>إدارة قائمة المطعم</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17231b;background:#f4f7f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px 16px 70px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}.brand{font-size:25px;font-weight:800}.muted{color:#647067}.card{background:white;border:1px solid #e1e9e1;border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:0 8px 25px #192b190b}.row{display:flex;gap:12px;align-items:center}.row>*{flex:1}input,button{font:inherit;border-radius:10px;padding:11px 12px;border:1px solid #d7dfd7}input{width:100%;background:#fff}button{cursor:pointer;background:#1f7136;color:white;border:0;font-weight:700}button.secondary{background:#edf3ed;color:#25412b}button.danger{background:#aa3232}.dish{display:grid;grid-template-columns:86px 1fr;gap:15px;align-items:start}.dish img{width:86px;height:86px;object-fit:cover;border-radius:14px;background:#edf0ed}.fields{display:grid;grid-template-columns:1fr 1fr 130px;gap:10px}.fields .wide{grid-column:1/-1}.dish-title{font-weight:800;margin-bottom:10px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.notice{padding:11px 13px;border-radius:10px;background:#eff6ef;color:#245c30;margin:12px 0}.notice.error{background:#fff0ee;color:#9b2e24}.login{max-width:460px;margin:8vh auto}.hidden{display:none!important}#count{font-size:14px}.thumb{font-size:12px;color:#68766b;margin-top:8px}.status{font-size:13px}.sticky{position:sticky;bottom:10px;z-index:5;background:#ffffffed;backdrop-filter:blur(10px);padding:12px;border:1px solid #dde5dd;border-radius:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:650px){.fields{grid-template-columns:1fr 1fr}.fields .wide{grid-column:1/-1}.wrap{padding-top:16px}.brand{font-size:20px}.row{flex-direction:column;align-items:stretch}}
</style></head><body><main class="wrap">
<header><div><div class="brand">إدارة قائمة المطعم</div><div class="muted">تعديل أسماء الأطباق وأسعارها وصورها</div></div><a href="../" class="muted">عرض الموقع</a></header>
<section id="login" class="card login"><h2>دخول المدير</h2><p class="muted">أدخل الرمز السري المضبوط في إعدادات Cloudflare Worker.</p><input id="pin" type="password" autocomplete="current-password" placeholder="الرمز السري"><div class="actions"><button id="loginBtn">فتح لوحة الإدارة</button></div><div id="loginMsg" class="status"></div></section>
<section id="panel" class="hidden"><div class="card"><div class="row"><input id="search" placeholder="ابحث باسم الطبق أو القسم"><span id="count" class="muted"></span><button id="reload" class="secondary">إعادة تحميل</button></div><div id="message" class="status"></div></div><div id="list"></div><div class="sticky"><span class="muted">التعديلات غير منشورة حتى تضغط حفظ.</span><button id="save">حفظ التغييرات</button></div></section>
</main><script src="./config.js"></script><script>
const $=id=>document.getElementById(id);const cfg=window.MENU_ADMIN_CONFIG||{};let menu=[],pin='',dirty=false;
function showMsg(target,text,error=false){target.textContent=text;target.className='status'+(error?' notice error':' notice')}
function api(path,options={}){return fetch(`${cfg.workerUrl}${path}`,options)}
function adminHeaders(json=true){return {...(json?{'Content-Type':'application/json'}:{}),'X-Admin-Pin':pin}}
function allDishes(){const out=[];menu.forEach((cat,ci)=>(cat.subCategories||[]).forEach((sub,si)=>(sub.dishes||[]).forEach((dish,di)=>out.push({cat,sub,dish,ci,si,di}))));return out}
async function load(){if(!cfg.workerUrl||cfg.workerUrl.includes('YOUR-WORKER'))throw Error('لم يكتمل إعداد Cloudflare بعد. راجع ملف CLOUDFLARE-SETUP.md.');const r=await api('/api/menu');const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'تعذر جلب القائمة.');menu=data.menu;if(!Array.isArray(menu)||!menu.length)throw Error('القائمة غير مهيأة في D1.');dirty=false;render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){const q=$('search').value.trim().toLowerCase(),items=allDishes().filter(x=>`${x.cat.title?.ar||''} ${x.sub.title?.ar||''} ${x.dish.name?.ar||''} ${x.dish.name?.en||''}`.toLowerCase().includes(q));$('count').textContent=`${items.length} طبق`;$('list').innerHTML=items.map(x=>`<article class="card dish" data-ci="${x.ci}" data-si="${x.si}" data-di="${x.di}"><img src="${esc(x.dish.img||'')}" alt="معاينة" onerror="this.style.visibility='hidden'"><div><div class="dish-title">${esc(x.cat.title?.ar||'')} / ${esc(x.sub.title?.ar||'')}</div><div class="fields"><label>الاسم بالعربية<input data-key="ar" value="${esc(x.dish.name?.ar||'')}"></label><label>الاسم بالإنجليزية<input data-key="en" value="${esc(x.dish.name?.en||'')}"></label><label>السعر<input data-key="price" type="number" min="0" step="1" value="${Number(x.dish.price)||0}"></label><label class="wide">رابط الصورة<input data-key="img" type="url" value="${esc(x.dish.img||'')}" placeholder="https://..."></label><label class="wide">رفع صورة من الجهاز<input data-key="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label></div><div class="thumb">الحد الأعلى للصورة 5 ميغابايت. يمكن أيضًا لصق رابط صورة مباشر HTTPS.</div></div></article>`).join('')||'<div class="card">لا توجد نتائج مطابقة.</div>';
 document.querySelectorAll('.dish input:not([type=file])').forEach(el=>el.addEventListener('input',()=>{const a=el.closest('.dish'),d=menu[+a.dataset.ci].subCategories[+a.dataset.si].dishes[+a.dataset.di],k=el.dataset.key;if(k==='ar'||k==='en'){d.name=d.name||{};d.name[k]=el.value}else if(k==='price')d.price=Number(el.value)||0;else d.img=el.value;dirty=true;if(k==='img'){const im=a.querySelector('img');im.src=el.value;im.style.visibility='visible'}}));
 document.querySelectorAll('.dish input[type=file]').forEach(el=>el.addEventListener('change',async()=>{const file=el.files?.[0];if(!file)return;if(file.size>5*1024*1024){showMsg($('message'),'حجم الصورة يتجاوز 5 ميغابايت.',true);el.value='';return}const a=el.closest('.dish');try{showMsg($('message'),'جارٍ رفع الصورة إلى Cloudflare R2...');const r=await api('/api/admin/upload',{method:'POST',headers:adminHeaders(false),body:file});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'فشل رفع الصورة.');const d=menu[+a.dataset.ci].subCategories[+a.dataset.si].dishes[+a.dataset.di];d.img=data.url;dirty=true;a.querySelector('[data-key="img"]').value=data.url;a.querySelector('img').src=data.url;a.querySelector('img').style.visibility='visible';showMsg($('message'),'رُفعت الصورة. احفظ التغييرات لنشرها ضمن القائمة.')}catch(e){showMsg($('message'),e.message,true)}finally{el.value=''}}))}
$('loginBtn').onclick=async()=>{pin=$('pin').value;if(!pin)return showMsg($('loginMsg'),'أدخل الرمز السري.',true);try{if(!cfg.workerUrl||cfg.workerUrl.includes('YOUR-WORKER'))throw Error('لم يكتمل إعداد Cloudflare بعد. راجع CLOUDFLARE-SETUP.md.');const v=await api('/api/admin/verify',{method:'POST',headers:adminHeaders(false)});const vd=await v.json().catch(()=>({}));if(!v.ok)throw Error(vd.error||'تعذر التحقق من الرمز.');await load();$('login').classList.add('hidden');$('panel').classList.remove('hidden')}catch(e){showMsg($('loginMsg'),e.message,true)}};
$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});$('search').oninput=render;$('reload').onclick=async()=>{if(dirty&&!confirm('ستُفقد تعديلاتك غير المحفوظة. متابعة؟'))return;try{await load();showMsg($('message'),'تم تحديث القائمة.')}catch(e){showMsg($('message'),e.message,true)}};
$('save').onclick=async()=>{if(!dirty)return showMsg($('message'),'لا توجد تغييرات لحفظها.');if(!confirm('حفظ التعديلات ونشرها للزوار؟'))return;try{const r=await api('/api/admin/menu',{method:'PUT',headers:adminHeaders(),body:JSON.stringify({menu})});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'فشل الحفظ ('+r.status+').');dirty=false;showMsg($('message'),'تم حفظ القائمة بنجاح. ستظهر التغييرات للزوار عند تحديث الموقع.')}catch(e){showMsg($('message'),e.message,true)}};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
</script></body></html>
