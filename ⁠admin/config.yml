backend:
  name: github
  repo: workmemo2007-gif/D1
  branch: main

media_folder: "images"
public_folder: ""

collections:
  - name: menu
    label: القائمة
    folder: "menu"
    create: true
    slug: "{{fields.name}}"
    fields:
      - {label: "اسم الوجبة", name: "name", widget: "string"}
      - {label: "السعر", name: "price", widget: "number"}
      - {label: "صورة الوجبة", name: "image", widget: "image"}
